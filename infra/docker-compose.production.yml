version: '3.9'

volumes:
  postgres_data:
  static_volume:
  media_volume:

services:
  db:
    image: postgres:16-alpine
    container_name: foodgram-db
    restart: always
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: tosky26/foodgram_backend:latest
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - static_volume:/app/static/
      - media_volume:/app/media/

  frontend:
    image: tosky26/foodgram_frontend:latest
    restart: always
    env_file: .env
    command: sh -c "cp -r /app/build/. /static/ && tail -f /dev/null"
    volumes:
      - static_volume:/static/

  nginx:
    image: tosky26/foodgram_nginx:latest
    restart: always
    env_file: .env
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ../frontend/build:/usr/share/nginx/html/
      - ../docs/:/usr/share/nginx/html/api/docs/
      - static_volume:/static/
      - media_volume:/media/

