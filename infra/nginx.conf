server {
    listen 80;
    server_name toskyfoodgram.hopto.org;
    server_tokens off;
    client_max_body_size 20M;

    return 301 https://$host$request_uri;
}


server {
    listen 443 ssl;
    server_name toskyfoodgram.hopto.org;

    server_tokens off;
    index index.html;
    client_max_body_size 20M;


    ssl_certificate /etc/letsencrypt/live/toskyfoodgram.hopto.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toskyfoodgram.hopto.org/privkey.pem;

    location /api/docs/ {
         alias /usr/share/nginx/html/api/docs/;
         index redoc.html;
    }

    location /api/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8000/api/;
    }

    location /s/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://backend:8000/s/;
    }

    location /admin/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8000/admin/;
    }


    location /media/ {
        alias /media/;
    }


    location /static/ {
        alias /static/static/;
    }


    location / {
        root /static;
        try_files $uri /index.html;
    }
}
